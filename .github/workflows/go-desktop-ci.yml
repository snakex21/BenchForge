name: Go desktop CI

on:
  push:
    branches: [main, "port/**", "fix/**", "feature/**"]
    paths: ["go-desktop/**", "frontend/**", ".github/workflows/go-desktop-ci.yml"]
  pull_request:
    paths: ["go-desktop/**", "frontend/**", ".github/workflows/go-desktop-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: go-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The UI is embedded into the binary; rebuild it so CI never ships a stale
      # or tampered committed bundle, and run the existing frontend tests.
      - name: Frontend (npm ci, tests, build:go)
        working-directory: frontend
        run: |
          npm ci
          npx vitest run
          npm run build:go

      - uses: actions/setup-go@v5
        with:
          go-version-file: go-desktop/go.mod
          cache-dependency-path: go-desktop/go.sum

      # webview_go needs CGO (MinGW-w64 gcc).
      - name: Ensure gcc (MinGW-w64)
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            choco install mingw -y --no-progress
            echo "C:\ProgramData\mingw64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      - name: Tool versions
        run: |
          go version
          gcc --version

      - name: gofmt
        shell: pwsh
        run: |
          $files = gofmt -l cmd internal
          if ($files) { $files; exit 1 }

      - name: go vet
        env:
          CGO_ENABLED: "1"
        run: go vet ./...

      - name: go test
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Build (stripped, trimmed, GUI subsystem)
        env:
          CGO_ENABLED: "1"
        run: go build -trimpath -ldflags "-H windowsgui -s -w -X main.version=ci-${{ github.sha }}" -o BenchForge.exe ./cmd/benchforge

      - uses: actions/upload-artifact@v4
        with:
          name: benchforge-go-desktop
          path: go-desktop/BenchForge.exe
          retention-days: 7
